name: Task digest push

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 Sri Lanka time (UTC+5:30)
  workflow_dispatch: {}     # allows a manual "Run workflow" button for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call task digest endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/task-digest"
